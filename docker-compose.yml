#version: '3.8'

services:

  # ===== БАЗА ДАННЫХ =====
  postgres:
    image: postgres:15
    container_name: shop_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ===== PGADMIN4 =====
  pgadmin:
    image: dpage/pgadmin4
    container_name: shop_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres

  # ===== REDIS =====
  redis:
    image: redis:7
    container_name: shop_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

# ===== ТОМА ДЛЯ ХРАНЕНИЯ ДАННЫХ =====
volumes:
  postgres_data:
  redis_data: